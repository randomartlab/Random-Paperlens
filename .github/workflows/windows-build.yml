name: Windows 构建

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci

      - name: 校验版本号一致性
        shell: bash
        # 三处版本号必须一致：package.json / tauri.conf.json / Cargo.toml。
        # 不一致会让安装包名、界面版本、应用元数据互相矛盾，误导问题排查。
        run: |
          A=$(node -p "require('./package.json').version")
          B=$(node -p "require('./src-tauri/tauri.conf.json').version")
          C=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          echo "package.json=$A  tauri.conf.json=$B  Cargo.toml=$C"
          if [ "$A" != "$B" ] || [ "$B" != "$C" ]; then
            echo "::error::版本号不一致，请先同步后再打包"
            exit 1
          fi

      - name: 构建并打包（NSIS）
        # MSI(WiX light) 对中文 productName 存在已知兼容问题，NSIS 安装包为交付形态
        run: npm run tauri build -- --bundles nsis

      - name: 上传安装包（Artifact 存档）
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe

      - name: 发布到 GitHub Release（仅 tag 推送触发）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: false
